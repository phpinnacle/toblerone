name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build project
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          export VERSION="${RELEASE_TAG#v}"
          ./gradlew build
          mkdir -p build/release
          cp "build/libs/phpinnacle-toblerone-${VERSION}-all.jar" build/release/phpinnacle-toblerone.jar
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" build/release/phpinnacle-toblerone.jar --verify-tag --draft --title "$RELEASE_TAG"
